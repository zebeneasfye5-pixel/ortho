<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="70%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Frame with Gold Ring -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Ornate Ethiopian Cross Iconography -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Beam -->
    <rect x="236" y="96" width="40" height="320" rx="8" fill="url(#gold)"/>
    <!-- Horizontal Cross Beam -->
    <rect x="136" y="196" width="240" height="40" rx="8" fill="url(#gold)"/>

    <!-- Central Diamond Emblem -->
    <polygon points="256,156 316,216 256,276 196,216" fill="url(#gold)" opacity="0.8"/>
    <circle cx="256" cy="216" r="16" fill="#1c0505"/>

    <!-- Traditional Axumite/Lalibela Finials -->
    <circle cx="256" cy="80" r="22" fill="url(#gold)"/>
    <circle cx="256" cy="432" r="22" fill="url(#gold)"/>
    <circle cx="120" cy="216" r="22" fill="url(#gold)"/>
    <circle cx="392" cy="216" r="22" fill="url(#gold)"/>

    <!-- Diagonal Flourishes -->
    <rect x="180" y="140" width="16" height="60" rx="4" transform="rotate(45 188 170)" fill="url(#gold)"/>
    <rect x="316" y="140" width="16" height="60" rx="4" transform="rotate(-45 324 170)" fill="url(#gold)"/>
    <rect x="180" y="276" width="16" height="60" rx="4" transform="rotate(-45 188 306)" fill="url(#gold)"/>
    <rect x="316" y="276" width="16" height="60" rx="4" transform="rotate(45 324 306)" fill="url(#gold)"/>
  </g>

  <!-- Sacred Ge'ez Title -->
  <text x="256" y="475" font-family="'Noto Serif Ethiopic', serif" font-size="28" font-weight="bold" fill="#FDE047" text-anchor="middle" letter-spacing="4">ኦርቶዶክስ</text>
</svg>
